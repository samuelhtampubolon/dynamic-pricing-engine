# Secrets are read from .env (see .env.example). Ports bind to loopback only.
services:
  pricing-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynamic-pricing-api
    env_file: .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      ALLOWED_HOSTS: 127.0.0.1,localhost,pricing-api
      DUCKDB_PATH: /app/data/pricing_lakehouse.duckdb
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lakehouse:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  pricing-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynamic-pricing-dashboard
    command: >
      python -m streamlit run src/ui/dashboard.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
      --server.enableXsrfProtection true --browser.gatherUsageStats false --theme.base dark
    env_file: .env
    environment:
      DUCKDB_PATH: /app/data/pricing_lakehouse.duckdb
      DUCKDB_READ_ONLY: "true"
      HOME: /tmp
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - lakehouse:/app/data:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      pricing-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lakehouse:
